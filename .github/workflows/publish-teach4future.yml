name: Publish prepared Teach4Future site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply the validated release archive
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/lambbross-lab/Teach4Future/teach4future-launch/teach4future-release.zip \
            --output /tmp/teach4future-release.zip
          unzip -o /tmp/teach4future-release.zip -d "$GITHUB_WORKSPACE"
          rm -f /tmp/teach4future-release.zip

      - name: Commit and publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish validated Teach4Future website"
          git push origin main
