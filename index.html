<!doctype html>
<html lang="en">
  <head>
    <script>
      // Workaround for sandboxed/iframe environments where window.fetch is read-only
      // and assignments like window.fetch = ... throw TypeErrors.
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _fetch; },
            set: function(val) { _fetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Failed to define fetch setter workaround:', e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
